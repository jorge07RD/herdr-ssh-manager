name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    # 1.88 is the floor declared in Cargo.toml (set by darling/instability, via ratatui);
    # building on it here is what
    # keeps that claim honest rather than aspirational.
    name: test (${{ matrix.os }}, rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: ["1.88", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # The suite is hermetic: temp dirs and checked-in fixtures, no network and no running
      # herdr, so it needs nothing installed beyond the toolchain.
      - run: cargo test

  build-script:
    name: fetch-or-build.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shell syntax
        run: sh -n scripts/fetch-or-build.sh
      # Exercises every fallback path with stubbed uname/curl/cargo and a local stand-in for
      # the GitHub release — no network involved.
      - name: hermetic tests
        run: sh scripts/tests/fetch-or-build.test.sh

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; $failed = $true }
            else { Write-Host "$($_.Name) parses cleanly" }
          }
          if ($failed) { exit 1 }

      # The Windows [[panes]]/[[actions]] carry PowerShell inline in the manifest, where
      # nothing would otherwise catch a syntax error until a user pressed the keybinding
      # and saw nothing happen. Parse those strings too.
      - name: Inline manifest PowerShell parses
        shell: pwsh
        run: |
          $manifest = Get-Content herdr-plugin.toml -Raw
          $snippets = [regex]::Matches($manifest, "(?s)'''(.*?)'''")
          if ($snippets.Count -eq 0) { Write-Error "no inline PowerShell found in the manifest"; exit 1 }
          $failed = $false
          foreach ($m in $snippets) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput(
              $m.Groups[1].Value, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; $failed = $true }
          }
          if ($failed) { exit 1 }
          Write-Host "$($snippets.Count) inline snippets parse cleanly"

  windows:
    # Windows is preview for this plugin: the popup panes cannot launch there (herdr resolves
    # the manifest's relative command against its own directory). The CLI does work, so it is
    # still worth testing — but advisory, so a Windows-only flake cannot block an unrelated PR.
    name: test (windows-latest, advisory)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
